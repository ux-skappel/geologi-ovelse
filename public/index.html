<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGB4100 Geologi – øving</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">TGB4100 <span>Geologi-øving</span></div>
    <div id="who" class="who"></div>
  </div>
</header>

<section id="auth" class="wrap hidden">
  <div class="card narrow">
    <h1>Hvem er du?</h1>
    <p class="mut">Øv til eksamen i TGB4100 Geologi, innføring. Skriv et brukernavn, så lagres fremgangen din. Bruk samme navn neste gang (også på en annen enhet) for å fortsette der du slapp. Ingen passord, ingen e-post.</p>
    <form id="authForm">
      <label>Brukernavn<input type="text" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="f.eks. eskil"></label>
      <div class="row"><button class="btn" type="submit">Start</button></div>
      <p id="authMsg" class="mut"></p>
    </form>
  </div>
</section>

<nav id="nav" class="hidden"><div class="in" id="tabs"></div></nav>
<main id="main" class="wrap hidden"></main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/questions.js"></script>
<script src="/cheat.js"></script>
<script src="/app.js"></script>
</body>
</html>
